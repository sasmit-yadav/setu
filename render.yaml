# Render blueprint for the SETU API and delivery worker (Part 22 topology).
#
# Two services, one repo. The API and the worker are separate processes because
# the worker blocks on XREADGROUP and must not share an event loop with request
# handling — and because a worker crash must not take the API down with it.
#
# Deliberately NOT here: services/ml. Render's free tier is ~512 MB and torch's
# import footprint alone is 300-500 MB, so the ML service lives on a Hugging
# Face Space instead (root Dockerfile). That split is the entire subject of
# Part 22; putting them back together is how you get OOM kills that look like
# flaky cold starts.
#
# Every secret below is marked sync:false, which means Render prompts for it and
# never stores it in this file. Nothing in here is a credential.

services:
  - type: web
    name: setu-api
    runtime: python
    plan: free
    region: singapore          # closest free region to India; lowest RTT for the demo
    buildCommand: pip install -r requirements.txt
    # One worker on free tier: 512 MB will not hold two. --timeout-keep-alive is
    # raised because the ops console holds a WebSocket open on /api/v1/ws/ops.
    startCommand: uvicorn services.api.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 65
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.1"
      # ── database: pooled for the app, direct for migrations (Part 23) ──
      # Paste the Neon URLs EXACTLY as Neon gives them, query string included.
      # asyncpg accepts them and negotiates TLS itself. Removing only
      # ?sslmode=require leaves &channel_binding=require glued to the database
      # name and asyncpg reports "database ...&channel_binding=require does not
      # exist", which reads as a missing database. See docs/DEPLOY.md.
      - key: DATABASE_URL_POOLED
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_POOL_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT_S
        value: "10"
      # ── redis: Upstash in production, never the local docker one ──
      - key: REDIS_URL
        sync: false
      - key: REDIS_NAMESPACE
        value: "setu:v1"
      # ── the API must never load model weights (Part 22) ──
      - key: SETU_LOAD_ML_MODELS
        value: "0"
      - key: HF_SPACE_URL
        sync: false
      - key: INTERNAL_ML_KEY
        sync: false
      # ── data-shaping secrets. Read Part 25's rotation notes before touching.
      # Rotating either is a migration or a release, not an env swap.
      - key: PHONE_HASH_PEPPER
        sync: false
      - key: PGCRYPTO_SYM_KEY
        sync: false
      - key: ALERT_SIGNING_SEED_B64
        sync: false
      # ── platform ──
      - key: JWT_SIGNING_SECRET
        sync: false
      - key: WEBHOOK_HMAC_SECRET
        sync: false
      # PUBLIC_BASE_URL is what Twilio status callbacks are built from, so it
      # must be this service's own https URL — not a tunnel — once deployed.
      - key: PUBLIC_BASE_URL
        sync: false
      # The deployed citizen PWA and console origins. Without these the browser
      # blocks every call, because the PWA is served from a different origin.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # ── channels: all optional, all fall back to the simulated carrier ──
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_VAPID_PUBLIC_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENABLED
        value: "true"

  - type: worker
    name: setu-worker
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m services.delivery.worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.1"
      # The worker needs the same database, redis and channel credentials as the
      # API — it is the process that actually sends. fromService keeps them in
      # one place rather than duplicating every secret across two services.
      # Points at the group that is populated by hand in the dashboard, NOT at a
      # blueprint-declared one. Render creating an empty group from this file and
      # the operator filling a differently-named one is an easy split-brain: the
      # worker silently reads the empty group, boots without a database, and the
      # API still looks healthy because it has its own envVars. Secret files are
      # per-service, so the group also carries fcm.json for the worker.
      - fromGroup: setu-shared-grp
